[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "georeason-eo"
version = "0.1.0"
description = "Temporal Earth Observation reasoning with Geospatial Foundation Models"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
